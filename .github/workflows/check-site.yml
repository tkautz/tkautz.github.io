name: Check site

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install requests
      - name: Types and lint
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.node.json
          npm run lint
      - name: Citation updater (offline)
        run: python -m unittest discover -s scripts -p test_update_citations.py
      - run: npx playwright install --with-deps chromium
      - name: Build and browser checks
        run: npm test -- --workers=2
      - name: Static site integrity
        run: python scripts/verify_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist/
          retention-days: 7
