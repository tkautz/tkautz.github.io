<!-- Skip to content link for accessibility -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<header>
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <h1>Tim Kautz</h1>
            </div>
            <nav class="main-nav" aria-label="Main navigation">
                <button class="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html" id="nav-home">Home</a></li>
                    <li><a href="cv.html" id="nav-cv">CV</a></li>
                    <li><a href="research.html" id="nav-research">Research</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<script>
    // Set active navigation item based on current page
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        if (currentPath.includes('index.html') || currentPath.endsWith('/')) {
            document.getElementById('nav-home').classList.add('active');
        } else if (currentPath.includes('cv.html')) {
            document.getElementById('nav-cv').classList.add('active');
        } else if (currentPath.includes('research.html')) {
            document.getElementById('nav-research').classList.add('active');
        }
        
        // Toggle mobile navigation
        const menuToggle = document.querySelector('.mobile-menu-toggle');
        menuToggle.addEventListener('click', function() {
            const navLinks = document.querySelector('.nav-links');
            const expanded = this.getAttribute('aria-expanded') === 'true';
            
            navLinks.classList.toggle('active');
            this.classList.toggle('active');
            this.setAttribute('aria-expanded', !expanded);
        });
    });
</script>
